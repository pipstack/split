<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to ZIP Splitter</title>
    <!-- Libraries -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 480px;
        }
        h2 { color: #333; margin-bottom: 25px; }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }
        .info-box {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            color: #0056b3;
            font-size: 14px;
            border-left: 5px solid #007bff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>PDF to ZIP Splitter</h2>
        
        <div class="input-group">
            <label>Upload PDF File:</label>
            <input type="file" id="pdfInput" accept="application/pdf">
        </div>

        <div id="pageInfo" class="info-box"></div>

        <div class="input-group">
            <label>Split Option:</label>
            <select id="splitOption">
                <option value="totalFiles">Split into 'X' number of files</option>
                <option value="pagesPerFile">Each file should have 'X' pages</option>
            </select>
        </div>

        <div class="input-group">
            <label id="valueLabel">Enter Number:</label>
            <input type="number" id="splitValue" placeholder="Enter value" min="1">
        </div>

        <button id="splitBtn">Create ZIP & Download</button>
        <p id="status"></p>
    </div>

    <script>
        const { PDFDocument } = PDFLib;
        let currentPdfDoc = null;
        let pdfBytes = null;

        // Step 1: Get total pages on upload
        document.getElementById('pdfInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            const infoBox = document.getElementById('pageInfo');
            const status = document.getElementById('status');
            
            if (!file) return;

            status.innerText = "Reading PDF...";
            try {
                pdfBytes = await file.arrayBuffer();
                currentPdfDoc = await PDFDocument.load(pdfBytes);
                const totalPages = currentPdfDoc.getPageCount();
                
                infoBox.style.display = "block";
                infoBox.innerHTML = `<strong>Total Pages: ${totalPages}</strong>`;
                status.innerText = "PDF Ready!";
            } catch (err) {
                status.innerText = "Error loading PDF.";
            }
        });

        document.getElementById('splitBtn').addEventListener('click', async () => {
            const option = document.getElementById('splitOption').value;
            const value = parseInt(document.getElementById('splitValue').value);
            const status = document.getElementById('status');
            const btn = document.getElementById('splitBtn');

            if (!currentPdfDoc) {
                alert("Please upload a PDF first!");
                return;
            }
            if (!value || value <= 0) {
                alert("Please enter a valid number!");
                return;
            }

            const totalPages = currentPdfDoc.getPageCount();
            let totalFilesToCreate = 0;
            let pagesPerFile = 0;

            // Step 2: Logic for calculating splits and Warning
            if (option === 'totalFiles') {
                totalFilesToCreate = value;
                pagesPerFile = Math.ceil(totalPages / value);
            } else {
                pagesPerFile = value;
                totalFilesToCreate = Math.ceil(totalPages / value);
            }

            const confirmMsg = `PDF has ${totalPages} pages.\n\n` + 
                               (option === 'totalFiles' 
                                ? `You want ${totalFilesToCreate} files. Each will have approx ${pagesPerFile} pages.` 
                                : `Each file will have ${pagesPerFile} pages. This will create ${totalFilesToCreate} files.`) + 
                                `\n\nProceed to create ZIP?`;

            if (!confirm(confirmMsg)) return;

            btn.disabled = true;
            status.innerText = "Generating files... please wait.";

            try {
                const zip = new JSZip();
                
                for (let i = 0; i < totalFilesToCreate; i++) {
                    const start = i * pagesPerFile;
                    const end = Math.min(start + pagesPerFile, totalPages);

                    if (start >= totalPages) break;

                    status.innerText = `Processing part ${i + 1} of ${totalFilesToCreate}...`;

                    const newDoc = await PDFDocument.create();
                    const pagesToCopy = Array.from({ length: end - start }, (_, index) => start + index);
                    const copiedPages = await newDoc.copyPages(currentPdfDoc, pagesToCopy);
                    copiedPages.forEach(page => newDoc.addPage(page));

                    const resultBytes = await newDoc.save();
                    
                    // Add the PDF to the ZIP folder
                    zip.file(`split_part_${i + 1}.pdf`, resultBytes);
                }

                status.innerText = "Zipping files... almost done!";
                const zipContent = await zip.generateAsync({ type: "blob" });
                
                // Download the Final ZIP
                const zipUrl = window.URL.createObjectURL(zipContent);
                const a = document.createElement('a');
                a.href = zipUrl;
                a.download = "split_pdfs.zip";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(zipUrl);

                status.innerText = "Done! ZIP file downloaded.";
            } catch (error) {
                console.error(error);
                status.innerText = "An error occurred.";
            } finally {
                btn.disabled = false;
            }
        });
    </script>

</body>
</html>
