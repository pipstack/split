<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro PDF Splitter</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 450px;
        }
        h2 { color: #333; margin-bottom: 25px; }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        button:hover { background-color: #218838; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }
        .info-box {
            background: #e7f3ff;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            color: #0056b3;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Pro PDF Splitter</h2>
        
        <div class="input-group">
            <label>Upload PDF File:</label>
            <input type="file" id="pdfInput" accept="application/pdf">
        </div>

        <div id="pageInfo" class="info-box"></div>

        <div class="input-group">
            <label>Split into how many files?</label>
            <input type="number" id="splitCountInput" placeholder="e.g. 14" min="1">
        </div>

        <button id="splitBtn">Split & Download</button>
        <p id="status"></p>
    </div>

    <script>
        const { PDFDocument } = PDFLib;
        let currentPdfDoc = null;
        let pdfBytes = null;

        // Step 1: Detect total pages when file is uploaded
        document.getElementById('pdfInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            const infoBox = document.getElementById('pageInfo');
            const status = document.getElementById('status');
            
            if (!file) return;

            status.innerText = "Reading PDF...";
            try {
                pdfBytes = await file.arrayBuffer();
                currentPdfDoc = await PDFDocument.load(pdfBytes);
                const totalPages = currentPdfDoc.getPageCount();
                
                infoBox.style.display = "block";
                infoBox.innerText = `Total Pages in PDF: ${totalPages}`;
                status.innerText = "PDF Ready!";
            } catch (err) {
                status.innerText = "Error loading PDF.";
                console.error(err);
            }
        });

        // Helper function to create a delay (sleep)
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        document.getElementById('splitBtn').addEventListener('click', async () => {
            const splitCountInput = document.getElementById('splitCountInput');
            const status = document.getElementById('status');
            const btn = document.getElementById('splitBtn');

            if (!currentPdfDoc) {
                alert("Please upload a PDF first!");
                return;
            }

            const splitCount = parseInt(splitCountInput.value);
            if (!splitCount || splitCount <= 0) {
                alert("Please enter a valid number of files!");
                return;
            }

            const totalPages = currentPdfDoc.getPageCount();
            const pagesPerFile = Math.ceil(totalPages / splitCount);

            // Step 2: Final Approval/Confirmation
            const confirmMsg = `PDF has ${totalPages} pages.\nSplitting into ${splitCount} files.\nEach file will have approx ${pagesPerFile} pages.\n\nDo you want to proceed?`;
            
            if (!confirm(confirmMsg)) {
                return;
            }

            // Disable button to prevent multiple clicks
            btn.disabled = true;

            try {
                for (let i = 0; i < splitCount; i++) {
                    const start = i * pagesPerFile;
                    const end = Math.min(start + pagesPerFile, totalPages);

                    if (start >= totalPages) break;

                    status.innerText = `Processing part ${i + 1} of ${splitCount}...`;

                    const newDoc = await PDFDocument.create();
                    const pagesToCopy = Array.from({ length: end - start }, (_, index) => start + index);
                    const copiedPages = await newDoc.copyPages(currentPdfDoc, pagesToCopy);
                    copiedPages.forEach(page => newDoc.addPage(page));

                    const resultBytes = await newDoc.save();
                    
                    // Step 3: Controlled Download
                    downloadBlob(resultBytes, `part_${i + 1}_of_${splitCount}.pdf`);

                    // Add a 800ms delay between each file to prevent browser from blocking
                    await sleep(800); 
                }
                status.innerText = "All files downloaded successfully!";
            } catch (error) {
                console.error(error);
                status.innerText = "An error occurred during splitting.";
            } finally {
                btn.disabled = false;
            }
        });

        function downloadBlob(data, fileName) {
            const blob = new Blob([data], { type: 'application/pdf' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }
    </script>

</body>
</html>
